version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medicare_postgres
    restart: always
    environment:
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: medicare_secure_password
      POSTGRES_DB: medicaredb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: medicare_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://medicare:medicare_secure_password@postgres:5432/medicaredb?schema=public"
      JWT_SECRET: "medicare-super-secret-jwt-key-v2-2026"
    depends_on:
      - postgres

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: medicare_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
